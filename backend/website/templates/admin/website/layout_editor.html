{% extends "admin/base_site.html" %}

{% block content %}
<h1>Drag-and-Drop Website Layout Editor</h1>
<p>Drag sections to reorder homepage flow, then click save.</p>

<form method="post" id="layoutEditorForm">
  {% csrf_token %}
  <input type="hidden" name="section_order" id="sectionOrderInput" />
  <ul id="layoutList" style="max-width:700px;padding:0;list-style:none;display:grid;gap:10px;">
    {% for section in section_order %}
      <li data-id="{{ section }}" style="padding:12px 14px;border:1px solid #c9d8ff;border-radius:10px;background:#fff;cursor:move;font-weight:600;color:#204388;">
        ☰ {{ section }}
      </li>
    {% endfor %}
  </ul>

  <div class="submit-row" style="margin-top:14px;">
    <input type="submit" value="Save layout order" class="default" />
  </div>
</form>

<script>
(function () {
  const list = document.getElementById('layoutList');
  const input = document.getElementById('sectionOrderInput');
  const form = document.getElementById('layoutEditorForm');
  if (!list || !input || !form) return;

  let dragging = null;
  list.querySelectorAll('li').forEach((item) => {
    item.draggable = true;
    item.addEventListener('dragstart', () => {
      dragging = item;
      item.style.opacity = '0.5';
    });
    item.addEventListener('dragend', () => {
      item.style.opacity = '1';
      dragging = null;
    });
    item.addEventListener('dragover', (event) => {
      event.preventDefault();
      if (!dragging || dragging === item) return;
      const rect = item.getBoundingClientRect();
      const before = (event.clientY - rect.top) < (rect.height / 2);
      list.insertBefore(dragging, before ? item : item.nextSibling);
    });
  });

  form.addEventListener('submit', () => {
    const ids = Array.from(list.querySelectorAll('li')).map((item) => item.dataset.id);
    input.value = ids.join(',');
  });
})();
</script>
{% endblock %}
